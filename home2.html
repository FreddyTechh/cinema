<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freddy's Cinema - Food & Drinks</title>
    <script src="https://kit.fontawesome.com/38ce96363c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./css/home2.css">
</head>
<body class="fullbody">
    <!-- Navigation Bar -->
    <nav class="navbar">
        <h2 class="logo">
            <i class="fa-solid fa-film fa-bounce fa-xl" style="color: #bf0303;"></i>
            <span>&nbsp;FREDDY'S</span> <span>CINEMA</span>
        </h2>
        
        <!-- Mobile Menu Toggle -->
        <div class="menu-toggle" id="mobile-menu">
            <i class="fas fa-bars"></i>
        </div>
        
        <!-- Navigation Links -->
        <ul class="nav-list" id="nav-list">
            <li><a href="index.html">HO<span>ME</span></a></li>
            <li><a href="home2.html" class="active">FOOD & DRINKS</a></li>
            <li><a href="index.html#Showtimes">SHOWTIMES</a></li>
            <li><a href="home3.html">RESERVATIONS</a></li>
            <li><a href="index.html">ABOUT US</a></li>
        </ul>
        
        <!-- Navigation Icons -->
        <div class="nav-icons">
            <i class="fa-solid fa-magnifying-glass fa-xl" style="color: #afb0b1;"></i>
            <div class="cart-indicator">
                <i class="fa-solid fa-cart-shopping fa-xl" style="color: #909192;"></i>
                <span class="cart-count" id="cart-count">0</span>
            </div>
        </div>
    </nav>
    
    <!-- Hero Section -->
    <section class="hero">
        <h1 class="hero-title">Tas<span>te</span><br><span class="flim">Film</span></h1>
        <p class="hero-text">
            We don't just watch films...<br>
            <span class="animated-text">
                <span class="outer-text">WE SHARE & TASTE THEM</span>
                <span class="inner-text">WE LIVE THEM</span>
            </span>
        </p>
    </section>
    
    <!-- Snacks Section -->
    <section class="menu-section">
        <h2 class="section-title">SNACKS</h2>
        <div class="menu-grid" id="snacks-grid">
            <!-- Snack items will be added here by JavaScript -->
        </div>
    </section>
    
    <!-- Drinks Section -->
    <section class="menu-section">
        <h2 class="section-title">DRINKS</h2>
        <div class="menu-grid" id="drinks-grid">
            <!-- Drink items will be added here by JavaScript -->
        </div>
    </section>
</body>
    <script src="./js/home2.js"></script>

</html>
